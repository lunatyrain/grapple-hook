name: GrappleHook
version: '${version}'
main: dev.grapplehook.GrappleHookPlugin
api-version: '26.2'
description: Grappling hook item with custom models, no particles
commands:
  grapplehook:
    description: Give yourself a grapple hook or reload the config
    usage: /grapplehook <give [player]|reload>
    aliases: [grapple, gh]
    permission: grapplehook.give
permissions:
  grapplehook.give:
    default: op
  grapplehook.use:
    default: true
